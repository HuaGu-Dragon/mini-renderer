on: [pull_request]
name: benchmark pull requests

permissions:
  contents: read

jobs:
  runBenchmark:
    name: run benchmark
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RAYON_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag=v7.0.0
        with:
          fetch-depth: 0

      - name: Record comparison commits
        shell: bash
        run: |
          echo "CHANGES_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"

      - name: Compare (Rayon-enabled, fixed four threads)
        shell: bash
        run: |
          git checkout --detach "$BASE_SHA"
          cargo bench --locked --bench rasterizer -- --save-baseline rayon-base
          git checkout --detach "$CHANGES_SHA"
          cargo bench --locked --bench rasterizer -- --baseline rayon-base

      - name: Compare (serial pipeline, Rayon disabled)
        shell: bash
        run: |
          git checkout --detach "$BASE_SHA"
          cargo bench --locked --no-default-features --features std,glam --bench rasterizer -- --save-baseline serial-base
          git checkout --detach "$CHANGES_SHA"
          cargo bench --locked --no-default-features --features std,glam --bench rasterizer -- --baseline serial-base
