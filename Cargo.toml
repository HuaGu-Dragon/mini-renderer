[package]
name = "mini-renderer"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
egui = "0.33.3"
egui-winit = "0.33.3"
egui_demo_lib = "0.33.3"
egui_extras = { version = "0.33.3", features = ["all_loaders"] }
image = "0.25.9"
softbuffer = { git = "https://github.com/rust-windowing/softbuffer.git"}
tobj = "4.0.3"
trybuild = "1.0.116"
winit = "0.30.12"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[dependencies]
glam = { version = "0.32.0", optional = true, default-features = false }
libm = { version = "0.2.16", optional = true }
rayon = { version = "1.11.0", optional = true }
mini-renderer-derive = { path = "./mini-renderer-derive", optional = true }

[features]
default = ["std", "glam", "derive", "rayon"]
std = ["glam?/std"]
rayon = ["dep:rayon"]
glam = ["dep:glam"]
derive = ["dep:mini-renderer-derive"]


libm = ["dep:libm", "glam?/libm"]

[[bench]]
name = "rasterizer"
harness = false
